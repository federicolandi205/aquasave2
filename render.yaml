# Render Blueprint for AQUASAVE. This targets the FastAPI app in aquasave_server/.
# The free PostgreSQL plan is temporary (30 days); upgrade the database in Render
# before expiry to retain its measurements. Free web instances can sleep when idle.
services:
  - type: web
    name: aquasave-web
    runtime: python
    region: oregon
    plan: free
    rootDir: aquasave_server
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: aquasave-postgres
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: AUTH_SECRET_KEY
        generateValue: true

databases:
  - name: aquasave-postgres
    databaseName: aquasave
    user: aquasave
    region: oregon
    plan: free
